services:
  # ----------------------------------------------------
  # 1. InsureEase Spring Boot Backend (Web Service)
  # ----------------------------------------------------
  - type: web
    name: insureease-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: PORT
        value: 8080

  # ----------------------------------------------------
  # 2. InsureEase React Frontend (Static Site)
  # ----------------------------------------------------
  - type: static_site
    name: insureease-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: insureease-backend
          property: host
